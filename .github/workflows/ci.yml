name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Reproduce and analyze a real pytest regression
        run: |
          python scripts/reproduce_pytest_demo.py --output-dir var/ci_demo
          opspilot triage --repo var/ci_demo/project --junit var/ci_demo/junit.xml --base HEAD --notes var/ci_demo/project/docs --output var/ci_demo/report --offline

  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build pytest
      - run: python scripts/reproduce_pytest_demo.py --output-dir var/distribution_demo
      - run: python -m build
      - name: Install wheel and analyze outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/opspilot-env"
          "$RUNNER_TEMP/opspilot-env/bin/python" -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/opspilot-smoke"
          cd "$RUNNER_TEMP/opspilot-smoke"
          "$RUNNER_TEMP/opspilot-env/bin/opspilot" triage --repo "$GITHUB_WORKSPACE/var/distribution_demo/project" --junit "$GITHUB_WORKSPACE/var/distribution_demo/junit.xml" --base HEAD --notes "$GITHUB_WORKSPACE/var/distribution_demo/project/docs" --output report --offline --json > answer.json
          "$RUNNER_TEMP/opspilot-env/bin/python" - <<'PY'
          import json
          from fastapi.testclient import TestClient
          from opspilot.api import create_app
          result = json.load(open('answer.json', encoding='utf-8'))
          assert result['status'] == 'analysis_ready'
          assert result['summary']['failures'] == 1 and result['summary']['passed'] == 4
          assert result['first_failure']['nodeid'] == 'test_cart.py::test_discount_at_threshold'
          assert result['related_changes'][0]['path'] == 'cart.py'
          assert any(e['kind'] == 'project_note' for e in result['evidence'])
          assert result['reproduction']['executed'] is False
          with TestClient(create_app()) as client:
              assert client.get('/health').status_code == 200
              assert 'pytest' in client.get('/').text
          PY
      - name: Build container
        run: docker build --tag opspilot-ci .
