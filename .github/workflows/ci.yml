name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: opspilot eval --split test --output reports/generated

  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel and run outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/opspilot-env"
          "$RUNNER_TEMP/opspilot-env/bin/python" -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/opspilot-smoke"
          cd "$RUNNER_TEMP/opspilot-smoke"
          "$RUNNER_TEMP/opspilot-env/bin/opspilot" ask '统计 orders-api 的错误率和 P95 延迟' --json > answer.json
          "$RUNNER_TEMP/opspilot-env/bin/opspilot" ingest
          "$RUNNER_TEMP/opspilot-env/bin/opspilot" eval --output reports
          "$RUNNER_TEMP/opspilot-env/bin/python" - <<'PY'
          import json
          from fastapi.testclient import TestClient
          from opspilot.api import create_app
          result = json.load(open('answer.json', encoding='utf-8'))
          assert result['status'] == 'answered'
          assert result['log_stats']['requests'] == 100
          assert result['log_stats']['http_error_rate'] == 0.2
          assert result['log_stats']['p95_ms'] == 1980.0
          with TestClient(create_app()) as client:
              assert client.get('/health').status_code == 200
              assert client.post('/ask', json={'question': '统计 orders-api 的请求数'}).json()['status'] == 'answered'
          PY
