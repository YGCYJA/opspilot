[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Evidence-grounded incident assistant with reproducible retrieval evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "YGCYJA"}]
keywords = ["rag", "incident-analysis", "langgraph", "retrieval", "observability"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1,<2", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/YGCYJA/opspilot"
Issues = "https://github.com/YGCYJA/opspilot/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=3,<6"]
local = ["sentence-transformers>=3,<6", "transformers>=4.51,<5", "lm-format-enforcer>=0.10,<1"]

[project.scripts]
opspilot = "opspilot.cli:main"

[tool.setuptools.packages.find]
include = ["opspilot*"]

[tool.setuptools.package-data]
opspilot = ["resources/data/*.csv", "resources/data/*.jsonl", "resources/data/knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
