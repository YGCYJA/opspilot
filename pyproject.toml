[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.2.0"
description = "Local pytest failure triage with Git diffs, project notes and evidence-linked reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "YGCYJA"}]
keywords = ["pytest", "debugging", "rag", "junit", "developer-tools"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/YGCYJA/opspilot"
Issues = "https://github.com/YGCYJA/opspilot/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
local = ["torch>=2.2", "transformers>=4.51,<5", "lm-format-enforcer>=0.10,<1"]

[project.scripts]
opspilot = "opspilot.cli:main"

[tool.setuptools.packages.find]
include = ["opspilot*"]

[tool.setuptools.package-data]
opspilot = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
